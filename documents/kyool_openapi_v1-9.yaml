openapi: 3.0.3
info:
  title: KYOOL Media Platform API
  description: |
    Comprehensive media management API for the KYOOL platform, supporting video content, web comics, 
    user management, content organization, and subscription services.
  version: 1.9.0
  contact:
    name: KYOOL API Support
    url: https://kyool.com/support
    email: api-support@kyool.com
  license:
    name: Proprietary
    url: https://kyool.com/license

servers:
  - url: https://api.kyool.com/v1
    description: Production server
  - url: https://staging-api.kyool.com/v1
    description: Staging server
  - url: http://localhost:8000/api/v1
    description: Development server

security:
  - bearerAuth: []

paths:
  # Authentication
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Users
  /users:
    get:
      tags:
        - Users
      summary: List all users (Admin only)
      parameters:
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Limit'
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: is_admin
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Users
      summary: Create user (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{user_id}:
    get:
      tags:
        - Users
      summary: Get user by ID (Admin only)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Users
      summary: Update user (Admin only)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # Media Descriptions
  /media-descriptions:
    get:
      tags:
        - Media Descriptions
      summary: Get all media descriptions
      parameters:
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Limit'
        - name: media_type
          in: query
          schema:
            $ref: '#/components/schemas/MediaTypeEnum'
        - name: is_featured
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of media descriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaDescriptionsResponse'
    post:
      tags:
        - Media Descriptions
      summary: Create media description (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaDescriptionCreate'
      responses:
        '201':
          description: Media description created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDescription'

  /media-descriptions/{id}:
    get:
      tags:
        - Media Descriptions
      summary: Get media description by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media description details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDescription'
        '404':
          description: Media description not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Media Descriptions
      summary: Update media description (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaDescriptionUpdate'
      responses:
        '200':
          description: Media description updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDescription'
    delete:
      tags:
        - Media Descriptions
      summary: Delete media description (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Media description deleted successfully
        '404':
          description: Media description not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /media-descriptions/bulk:
    post:
      tags:
        - Media Descriptions
      summary: Bulk create media descriptions (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMediaDescriptionRequest'
      responses:
        '201':
          description: Bulk creation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkMediaDescriptionResponse'

  # Video Files
  /video-files:
