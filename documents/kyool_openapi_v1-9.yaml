      responses:
        '200':
          description: List of video files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVideoFilesResponse'
    post:
      tags:
        - Video Files
      summary: Create video file (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoFileCreate'
      responses:
