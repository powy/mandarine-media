components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Skip:
      name: skip
      in: query
      description: Number of records to skip
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    # Base Models
    User:
      type: object
      required:
        - id
        - creation_date_utc
        - email
        - full_name
        - is_active
        - is_admin
      properties:
        id:
          type: string
          format: uuid
        creation_date_utc:
          type: string
          format: date-time
        email:
          type: string
          format: email
        full_name:
          type: string
        is_active:
          type: boolean
        is_admin:
          type: boolean

    MediaDescription:
      type: object
      required:
        - id
        - creation_date_utc
        - file_number
        - episode_title
        - media_type
      properties:
        id:
          type: string
          format: uuid
        creation_date_utc:
          type: string
          format: date-time
        file_number:
          type: integer
        episode_title:
          type: string
        media_type:
          $ref: '#/components/schemas/MediaTypeEnum'
        file_name:
          type: string
          nullable: true
        program_id:
          type: string
          format: uuid
          nullable: true
        season_id:
          type: string
          format: uuid
          nullable: true
        episode_number:
          type: integer
          nullable: true
        media_categories_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        themes_and_genres_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        descriptive_summary_text:
          type: string
          nullable: true
        synopsis_text:
          type: string
          nullable: true
        contract_start_date_utc:
          type: string
          format: date-time
          nullable: true
        contract_end_date_utc:
          type: string
          format: date-time
          nullable: true
        production_year:
          type: integer
          nullable: true
        actors_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        directors_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        productor_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        authors_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        origin_country_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        original_languages_id:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        copyright_owner_id:
          type: string
          nullable: true
        available_countries_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        eligible_plans:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        audience_categories_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        slug:
          type: string
          nullable: true
          description: SEO-friendly URL slug (auto-generated from title if empty)
        image_fullscreen:
          type: string
          format: uuid
          nullable: true
        image_thumbnail1:
          type: string
          format: uuid
          nullable: true
        image_thumbnail2:
          type: string
          format: uuid
          nullable: true
        image_mobile_home:
          type: string
          format: uuid
          nullable: true
        image_desktop_home:
          type: string
          format: uuid
          nullable: true
        additional_images_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        tag_text_list:
          type: array
          items:
            type: string
          nullable: true
          description: Human-readable tags/keywords
        translation_share:
          type: number
          format: float
          nullable: true
        sacem_share:
          type: number
          format: float
          nullable: true
        other_share:
          type: number
          format: float
          nullable: true
        revenue_share:
          type: number
          format: float
          nullable: true
        paid_token_cost:
          type: integer
          nullable: true
        expected_filename:
          type: string
          nullable: true

    VideoFile:
      type: object
      required:
        - id
        - creation_date_utc
      properties:
        id:
          type: string
          format: uuid
        creation_date_utc:
          type: string
          format: date-time
        media_description_id:
          type: string
          format: uuid
          nullable: true
        encodage_date_utc:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        subtitle_languages_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        audio_languages_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        resolutions_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        accessibilities_id_list:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        file_url:
          type: string
          nullable: true
        file_name:
          type: string
          nullable: true
        encoding_status:
          $ref: '#/components/schemas/EncodingStatusEnum'
        upload_method:
          $ref: '#/components/schemas/UploadMethodEnum'
        upload_status:
          $ref: '#/components/schemas/UploadStatusEnum'
        file_size_bytes:
          type: integer
          nullable: true
        video_codec:
          type: string
          nullable: true
        audio_codec:
          type: string
          nullable: true
        file_format:
          type: string
          nullable: true
