        - title
        - is_active
        - display_order
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        display_order:
          type: integer

    CategoryListUpdate:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        display_order:
          type: integer

    # JSON Response schemas
    ContentListJSON:
      type: object
      required:
        - id
        - title
        - thumbnail_format
        - last_updated
        - items
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        thumbnail_format:
          $ref: '#/components/schemas/ThumbnailFormatEnum'
        description:
          type: string
        last_updated:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentListItemJSON'

    ContentListItemJSON:
      type: object
      required:
        - content_id
        - content_type
        - title
        - display_order
      properties:
        content_id:
          type: string
          format: uuid
        content_type:
          type: string
          enum: [program, season, media_description]
        title:
          type: string
        thumbnail_url:
          type: string
        display_order:
          type: integer

    ScreenDescriptionJSON:
      type: object
      required:
        - id
        - title
        - last_updated
        - content_lists
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        screen_type:
          type: string
        last_updated:
          type: string
          format: date-time
        content_lists:
          type: array
          items:
            $ref: '#/components/schemas/ContentListJSON'

    CategoryListJSON:
      type: object
      required:
        - id
        - name
        - title
        - is_active
        - display_order
        - items
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        title:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        display_order:
          type: integer
        last_updated:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object

    # Request schemas for reordering
    ReorderContentRequest:
      type: object
      required:
        - content_items
        - content_types
      properties:
        content_items:
          type: array
          items:
            type: string
            format: uuid
        content_types:
          type: array
          items:
            type: string

    ReorderListsRequest:
      type: object
      required:
        - content_lists
      properties:
        content_lists:
          type: array
          items:
            type: string
            format: uuid

    # Bulk operations
    BulkMediaDescriptionRequest:
      type: object
      required:
        - descriptions
      properties:
        descriptions:
          type: array
          items:
            $ref: '#/components/schemas/MediaDescriptionCreate'

    BulkMediaDescriptionResponse:
      type: object
      required:
        - created_count
        - failed_count
        - batch_id
        - reports
      properties:
        created_count:
          type: integer
        failed_count:
          type: integer
        batch_id:
          type: string
          format: uuid
        reports:
          type: array
          items:
            $ref: '#/components/schemas/DescriptionReport'

    # Pagination
    PaginationInfo:
      type: object
      required:
