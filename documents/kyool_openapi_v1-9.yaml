          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Video Files
      summary: Update video file (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoFileUpdate'
      responses:
        '200':
          description: Video file updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoFile'
    delete:
      tags:
        - Video Files
      summary: Delete video file (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Video file deleted successfully

  # Content Lists
  /content-lists:
    get:
      tags:
        - Content Lists
      summary: Get all content lists
      parameters:
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Limit'
