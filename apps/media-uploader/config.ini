# Media Upload GUI Configuration
# Edit this file with your actual credentials and settings

[general]
verbose=true
# Default maximum concurrent uploads for parallel processing
maxConcurrentUploads=10
# Number of retry attempts for failed uploads
retryAttempts=3
# Delay between retries in milliseconds
retryDelay=5000

# Parallel Processing Configuration
[parallel]
# Enable/disable parallel upload processing
enabled=true
# Maximum number of concurrent upload processes (1-20)
maxConcurrentUploads=10
# Number of retry attempts for failed processes
retryAttempts=5
# Delay between retries in milliseconds (exponential backoff)
retryDelay=5000

# Process Management Configuration
[process]
# Maximum time a worker process can run before timing out (in milliseconds)
# Default: 36000000 ms (10 hour)
workerTimeout=36000000
# Interval for heartbeat checks in milliseconds
# Default: 10000 ms (10 seconds)
heartbeatInterval=10000
# Maximum age for cleanup of old progress/log files (in milliseconds)
# Default: 86400000 ms (24 hours)
cleanupAge=86400000


[backend]
baseUrl=https://api.dev.kyool.fr
username=admin@kyool.com
password=admin123

[mux]
tokenId=fake_mux_token_id_3
tokenSecret=fake_mux_secret_2

[s3]
accessKeyId=fake_aws_access_id
secretAccessKey=fake_aws_secret_key
region=eu-west-3

[s3.pictures]
bucket=kyool-public-files
keyPrefix=images/visuals

[s3.subtitles]
bucket=kyool-temp-uploads
keyPrefix=subtitles-uploads

[logging]
enabled=true
level=info
file=./upload-gui.log
console=true

