# Media Upload GUI Configuration
# Edit this file with your actual credentials and settings

[general]
verbose=true
# Default maximum concurrent uploads for parallel processing
maxConcurrentUploads=1000
# Number of retry attempts for failed uploads
retryAttempts=3
# Delay between retries in milliseconds
retryDelay=5000

# Parallel Processing Configuration
[parallel]
# Enable/disable parallel upload processing
enabled=true
# Maximum number of concurrent upload processes (1-1000)
maxConcurrentUploads=1000
# Number of retry attempts for failed processes
retryAttempts=3
# Delay between retries in milliseconds (exponential backoff)
retryDelay=5000

# Process Management Configuration
[process]
# Maximum time a worker process can run before timing out (in milliseconds)
# Default: 43200000 ms (12 hours)
workerTimeout=43200000
# Interval for heartbeat checks in milliseconds
# Default: 5000 ms (5 seconds)
heartbeatInterval=5000
# Maximum age for cleanup of old progress/log files (in milliseconds)
# Default: 86400000 ms (24 hours)
cleanupAge=86400000

[backend]
baseUrl=https://your-api.com
username=your-username
password=your-password

[mux]
tokenId=your-mux-token-id
tokenSecret=your-mux-token-secret

[drm]
# Optional: DRM Configuration ID for protected content
# Only needed if uploading DRM-protected videos
# configurationId=your-drm-config-id

[s3]
accessKeyId=your-access-key
secretAccessKey=your-secret-key
region=us-east-1

[s3.pictures]
bucket=your-pictures-bucket
keyPrefix=pictures/

[s3.subtitles]
bucket=your-subtitles-bucket
keyPrefix=subtitles/

[logging]
enabled=true
level=info
file=./upload-gui.log
console=true
