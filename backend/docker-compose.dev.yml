services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=kyool_user
      - POSTGRES_PASSWORD=kyool_password
      - POSTGRES_DB=kyool_media
    volumes:
      - .:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=kyool_user
      - POSTGRES_PASSWORD=kyool_password
      - POSTGRES_DB=kyool_media
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: